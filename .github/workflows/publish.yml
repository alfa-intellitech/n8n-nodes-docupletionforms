# Publishes this n8n community node package to npm on every version tag push.
#
# n8n requires community nodes submitted for verification to be published via
# GitHub Actions with an npm provenance statement — provenance lets anyone
# cryptographically verify that a package was built by this exact workflow,
# from this exact repository and commit. That in turn requires this workflow
# to run from a *public* repository matching this package's package.json
# "repository" field exactly (npm provenance does not support private
# source repos).
#
# This does NOT use @n8n/node-cli's `release` command (n8n's own reference
# n8n-nodes-starter workflow does) — that command drives an interactive
# version-bump/changelog/tag flow meant to be run locally, and adopting it
# means depending on scaffolding conventions this package wasn't built with.
# Instead, `npm run release` here is this package's own script
# (build && lint && npm publish --provenance) — same provenance mechanism,
# without the extra tooling dependency. Version bumping and tagging remain
# manual (`npm version <patch|minor|major>` locally, then `git push --tags`).
#
# ─── ONE-TIME SETUP (on npmjs.com) ─────────────────────────────────────────
#
# OIDC Trusted Publishing (recommended, no long-lived secrets):
#   1. Log in to npmjs.com and open this package's settings (after its
#      first-ever publish — Trusted Publishers can only be configured for
#      a package that already exists on the registry).
#   2. Under "Publish access" → "Trusted Publishers", click "Add a publisher".
#   3. Select GitHub Actions and fill in:
#        Repository owner: alfa-intellitech
#        Repository name:  n8n-nodes-docupletionforms
#        Workflow name:    publish.yml
#        Environment:      (leave blank)
#   4. Leave NPM_TOKEN unset in this repo's secrets — GitHub's OIDC token is
#      used instead.
#
# The very first publish (before a Trusted Publisher can be configured) has
# to be done manually from a local machine with `npm publish --access public`
# — provenance isn't available for that one, only for subsequent tag-triggered
# releases via this workflow.

name: Publish

on:
  push:
    tags:
      - '*.*.*'

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest

    permissions:
      # Required to mint an OIDC token for npm provenance attestation.
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Release
        run: |
          [ -n "$NPM_TOKEN" ] && npm config set //registry.npmjs.org/:_authToken "$NPM_TOKEN"
          npm run release
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
