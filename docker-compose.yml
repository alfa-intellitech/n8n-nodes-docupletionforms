services:
  n8n:
    image: n8nio/n8n:latest
    ports:
      - "5678:5678"
    environment:
      N8N_CUSTOM_EXTENSIONS: /custom-nodes/n8n-nodes-docupletionforms
      N8N_LOG_LEVEL: debug
    volumes:
      - n8n_data:/home/node/.n8n
      - .:/custom-nodes/n8n-nodes-docupletionforms

volumes:
  n8n_data:
